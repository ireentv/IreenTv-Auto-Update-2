name: Auto Update Playlist

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 * * * *'
  workflow_dispatch: # এটি রাখার কারণে আপনি Actions ট্যাব থেকে ম্যানুয়ালি Run করতে পারবেন

# গিটহাবে ফাইল পুশ করার জন্য রাইট পারমিশন
permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          # Playwright এবং Chromium-এর প্রয়োজনীয় সিস্টেম প্যাকেজ ইনস্টল
          playwright install --with-deps chromium

      - name: Run Playlist Generator Script
        env:
          SOURCE_JSON_URL: ${{ secrets.SOURCE_JSON_URL }}
          SPOOF_IP: ${{ secrets.SPOOF_IP }}
          STREAM_ORIGIN: ${{ secrets.STREAM_ORIGIN }}
        run: |
          python main.py  # আপনার পাইথন ফাইলটির নাম যদি অন্য কিছু হয়, তবে main.py এর জায়গায় সেটি লিখুন

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # শুধু নতুন তৈরি বা আপডেট হওয়া m3u এবং json ফাইলগুলো স্টেজ করা
          git add *.m3u *.json
          
          # কোনো পরিবর্তন থাকলে তবেই কমিট এবং পুশ করবে
          if git diff --staged --quiet; then
            echo "No changes found to commit."
          else
            git commit -m "Auto-updated playlists [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
