name: Auto Update Live Sports Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [api_updated]

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Playlist Generator
        env:
          CHANNELS_API_URL: ${{ secrets.CHANNELS_API_URL }}
          SPOOF_IP: ${{ secrets.SPOOF_IP }}
          STREAM_ORIGIN: ${{ secrets.STREAM_ORIGIN }}
        run: |
          python update_playlist.py

      - name: Commit and Push if changes detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Live_Sports.m3u Live_Sports.json
          
          if git diff --staged --quiet; then
            echo "No changes found. Skipping commit."
          else
            git commit -m "Auto Update Playlist: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          fi
