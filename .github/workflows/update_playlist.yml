name: Auto Update IPTV Playlists

on:
  schedule:
    - cron: '0 * * * *'  # প্রতি ১ ঘণ্টা পরপর রান হবে
  workflow_dispatch:      # ম্যানুয়ালি রান করার বাটন

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Process & Generate Playlists
        env:
          SOURCE_PLAYLISTS: ${{ secrets.SOURCE_PLAYLISTS }}
        run: |
          python process.py

      - name: Commit and Push Directly to Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json *.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔁 Auto-update playlists [$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M %p')]" && git push)
